<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>BayamSafe Checkout</title>
  <link rel="stylesheet" href="/checkout.css">
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex justify-center p-3 sm:p-6">
<main class="w-full max-w-md bg-white rounded-3xl shadow-xl overflow-hidden flex flex-col border border-slate-200">

  <header class="bg-emerald-700 p-5 text-white flex justify-between items-center">
    <div>
      <h1 class="font-black text-lg">🛡️ BayamSafe</h1>
      <p class="text-xs text-emerald-100" data-i18n="tagline"></p>
    </div>
    <button id="langBtn" class="min-h-[44px] bg-white/20 hover:bg-white/30 text-xs px-3 py-1.5 rounded-full font-bold"></button>
  </header>

  <div class="p-5 space-y-4">
    <div id="error" tabindex="-1" role="alert" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl p-3"></div>
    <section id="absenceBanner" class="hidden bg-amber-100 border-2 border-amber-500 rounded-2xl p-4 space-y-2" aria-labelledby="absenceTitle">
      <h2 id="absenceTitle" class="font-extrabold text-amber-900 text-sm" data-i18n="absenceTitle"></h2>
      <div id="absenceTimer" class="font-mono text-2xl font-black text-amber-900" role="timer"></div>
      <a id="absenceCall" class="hidden w-full min-h-[44px] flex items-center justify-center bg-amber-700 text-white font-extrabold text-sm rounded-xl px-3" href="#"></a>
    </section>
    <div id="loading" class="text-center text-sm text-slate-500 py-10" data-i18n="loading"></div>

    <div id="content" class="hidden space-y-4">
      <!-- Merchant -->
      <section class="flex items-center justify-between rounded-2xl border border-slate-200 p-3">
        <div>
          <div class="font-extrabold text-sm" id="merchantName"></div>
          <div id="verifiedBadge" class="hidden text-[11px] font-bold text-emerald-700" data-i18n="verified"></div>
          <div id="unverifiedBadge" class="hidden text-[11px] text-slate-500" data-i18n="unverified"></div>
        </div>
        <span class="font-mono text-xs text-slate-500" id="trackingCode"></span>
      </section>

      <!-- Order summary -->
      <section class="bg-slate-50 rounded-2xl p-4 border border-slate-200 text-sm space-y-1.5">
        <div class="flex justify-between items-start gap-2">
          <h2 class="text-base font-extrabold" id="itemTitle"></h2>
          <span id="statusBadge" class="shrink-0 bg-amber-100 text-amber-800 text-[11px] font-bold px-2.5 py-0.5 rounded-full"></span>
        </div>
        <div class="flex justify-between text-xs text-slate-600"><span data-i18n="item"></span><span class="font-bold" id="itemPrice"></span></div>
        <div class="flex justify-between text-xs text-slate-600"><span data-i18n="delivery"></span><span class="font-bold" id="deliveryFee"></span></div>
        <div id="agencyRow" class="hidden flex justify-between text-xs text-slate-600"><span data-i18n="agencyFee"></span><span class="font-bold" id="agencyFee"></span></div>
        <div id="routeRow" class="hidden text-xs text-slate-600"></div>
        <div id="recipientRow" class="hidden text-xs font-bold text-slate-700"></div>
        <div class="flex justify-between pt-2 border-t border-slate-200 font-extrabold">
          <span id="totalLabel"></span><span class="text-emerald-700" id="total"></span>
        </div>
      </section>

      <!-- Release code -->
      <section id="codeSection" class="hidden bg-emerald-50 border-2 border-emerald-500 rounded-2xl p-4 text-center space-y-1">
        <div class="text-[11px] font-bold text-slate-500 uppercase tracking-widest" data-i18n="codeTitle"></div>
        <div class="font-mono text-4xl font-black text-emerald-700 tracking-[0.3em]" id="releaseCode"></div>
        <p class="text-xs text-red-600 font-bold" data-i18n="codeWarning"></p>
      </section>
 <section id="riderCard" class="hidden flex items-center gap-3 bg-slate-900 text-white rounded-2xl p-3">
        <img id="riderPhoto" alt="" class="hidden w-14 h-14 rounded-xl object-cover bg-slate-700">
        <div class="min-w-0">
          <div class="text-[11px] uppercase tracking-widest text-emerald-300 font-bold" data-i18n="riderTitle"></div>
          <div class="font-extrabold" id="riderName"></div>
          <div class="text-xs text-slate-300 font-mono" id="riderMeta"></div>
          <div class="text-[11px] text-slate-400" id="riderVerify"></div>
          <a id="riderCall" class="hidden mt-1 inline-block text-xs font-bold text-emerald-300 underline" href="#"></a>
        </div>
      </section>

      <section id="trackSection" class="hidden space-y-2 bg-slate-900 text-white rounded-2xl p-3">
        <div class="flex justify-between items-center">
          <span class="text-[11px] uppercase tracking-widest text-emerald-300 font-bold" data-i18n="trackTitle"></span>
          <span class="text-[11px] text-slate-400" id="trackAge"></span>
        </div>
        <div id="nearBanner" class="hidden bg-amber-400 text-slate-900 text-xs font-extrabold rounded-xl p-2" data-i18n="nearBanner"></div>
        <div id="trackMap" style="height:200px;border-radius:12px;z-index:0" class="text-xs text-slate-400 flex items-center justify-center"></div>
        <div class="text-sm font-bold" id="trackInfo"></div>
      </section>

      <section id="followSection" class="hidden bg-sky-50 border border-sky-200 rounded-2xl p-3 text-xs space-y-2">
        <button id="followBtn" class="min-h-[44px] w-full bg-sky-600 hover:bg-sky-700 text-white font-bold py-2.5 rounded-xl" data-i18n="followBtn"></button>
        <p class="text-slate-600" data-i18n="followHint"></p>
      </section>
      <div id="followingNote" class="hidden text-xs text-sky-800 font-bold" data-i18n="following"></div>
      <section id="otherDevice" class="hidden bg-amber-50 border border-amber-300 rounded-2xl p-3 text-xs text-amber-900" data-i18n="otherDevice"></section>

      <!-- Payment -->
      <section id="paySection" class="hidden space-y-3">
        <label class="block text-xs font-bold text-slate-700 uppercase" for="payerPhone" data-i18n="payWith"></label>
        <input id="payerPhone" type="tel" inputmode="numeric" autocomplete="tel" placeholder="6XX XX XX XX"
               class="w-full p-3 border border-slate-300 rounded-xl text-base focus:ring-2 focus:ring-emerald-500">
        <div id="operatorHint" class="text-xs text-slate-500 h-4"></div>
        <button id="payBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white font-extrabold py-3.5 rounded-2xl"></button>
        <p class="text-[11px] text-slate-500" data-i18n="escrowExplainer"></p>
      </section>

      <section id="pendingSection" class="hidden bg-sky-50 border border-sky-200 rounded-2xl p-4 text-sm space-y-2">
        <div class="font-bold pulse" data-i18n="approveOnPhone"></div>
        <div class="text-xs text-slate-600" id="ussdHint"></div>
        <button id="simulateBtn" class="min-h-[44px] hidden w-full bg-slate-800 text-white text-xs font-bold py-2 rounded-xl" data-i18n="simulate"></button>
      </section>

      <section id="codInfo" class="hidden bg-slate-50 border border-slate-200 rounded-2xl p-3 text-xs" data-i18n="codInfo"></section>

      <!-- Delivery details -->
      <section id="deliverySection" class="hidden space-y-2 bg-emerald-50/40 p-4 rounded-2xl border border-emerald-200">
        <div class="text-xs font-bold text-emerald-900 uppercase" data-i18n="deliveryPoint"></div>
        <button id="gpsBtn" class="min-h-[44px] w-full bg-white text-emerald-800 text-xs font-bold py-2.5 rounded-xl border border-emerald-300" data-i18n="useGps"></button>
        <div id="map" class="w-full border border-slate-300 text-xs text-slate-500 flex items-center justify-center" role="application" aria-label="Carte"></div>
        <div id="gpsStatus" class="text-[11px] text-emerald-700"></div>
        <input id="addressInput" maxlength="200" class="w-full text-sm p-2.5 bg-white border border-slate-300 rounded-xl">
        <input id="landmarkInput" maxlength="200" class="w-full text-sm p-2.5 bg-white border border-slate-300 rounded-xl">
        <button id="saveDeliveryBtn" class="min-h-[44px] w-full bg-emerald-700 text-white text-xs font-bold py-2.5 rounded-xl" data-i18n="saveDelivery"></button>

        <div class="pt-2 border-t border-emerald-200 space-y-2">
          <div class="text-xs font-bold text-amber-900"><span data-i18n="voiceTitle"></span> <span id="voiceTimer" class="font-mono">0s / 15s</span></div>
          <div class="flex gap-2 items-center">
            <button id="recordBtn" class="min-h-[44px] flex-1 bg-amber-500 text-white text-xs font-bold py-2 rounded-xl" data-i18n="record"></button>
            <audio id="voicePlayback" controls class="hidden h-9 w-40"></audio>
          </div>
          <div id="voiceStatus" class="text-[11px] text-slate-600"></div>
        </div>
      </section>

      <!-- Timeline -->
      <section class="text-xs">
        <div class="font-bold text-slate-700 mb-1" data-i18n="timeline"></div>
        <ol id="timeline" class="space-y-1 text-slate-600"></ol>
      </section>

      <div id="statusMsg" class="hidden text-sm font-bold text-emerald-800 bg-emerald-50 border border-emerald-200 rounded-xl p-3" role="status" aria-live="polite"></div>

      <section id="arrivalSection" class="hidden space-y-2">
        <p class="text-xs text-slate-600" data-i18n="arrivalHint"></p>
        <button id="arrivalBtn" class="w-full min-h-[44px] bg-sky-700 hover:bg-sky-800 disabled:opacity-50 text-white text-sm font-bold py-2.5 rounded-xl" data-i18n="arrivalBtn"></button>
      </section>

      <button id="receivedBtn" class="hidden w-full min-h-[44px] bg-emerald-700 hover:bg-emerald-800 disabled:opacity-50 text-white font-extrabold py-3 rounded-2xl" data-i18n="receivedBtn"></button>

      <section id="evidenceSection" class="hidden space-y-2 bg-red-50 border border-red-200 rounded-2xl p-4" aria-labelledby="evidenceTitle">
        <h2 id="evidenceTitle" class="text-sm font-extrabold text-red-900" data-i18n="evidenceTitle"></h2>
        <p class="text-xs text-slate-700" id="evidenceHint" data-i18n="evidenceHint"></p>
        <input id="evidenceInput" type="file" accept="image/jpeg,image/png,image/webp" multiple class="sr-only" aria-describedby="evidenceHint evidenceCount">
        <button id="evidenceBtn" type="button" class="w-full min-h-[44px] bg-white border border-red-300 text-red-800 text-sm font-bold py-2.5 rounded-xl disabled:opacity-50" data-i18n="evidenceChoose"></button>
        <div id="evidenceCount" class="text-xs font-bold text-slate-700" role="status" aria-live="polite"></div>
        <ul id="evidenceThumbs" class="grid grid-cols-5 gap-2"></ul>
        <div id="evidenceErr" class="hidden text-xs text-red-700 font-bold" role="alert"></div>
      </section>

      <button id="disputeBtn" class="hidden w-full min-h-[44px] border border-red-300 text-red-700 text-sm font-bold py-2.5 rounded-xl" data-i18n="reportProblem"></button>
      <button id="cancelBtn" class="hidden w-full min-h-[44px] border border-slate-300 text-slate-700 text-sm font-bold py-2.5 rounded-xl" data-i18n="cancelOrder"></button>
    </div>
  </div>

  <footer class="p-3 bg-slate-50 border-t border-slate-200 text-center text-[10px] text-slate-500" data-i18n="footer"></footer>
</main>

<script>
(() => {
  const I18N = {
    fr: {
      receivedBtn: 'J’ai reçu mon colis', receivedConfirm: 'Confirmer la réception ? Le paiement sera remis au vendeur. Cette action est irréversible.', receivedDone: 'Merci ! Le vendeur est payé.',
      arrivalBtn: 'L’agence m’a appelé, mon colis est arrivé', arrivalHint: 'Dites-le-nous quand l’agence vous a appelé : nous prévenons le livreur local.', arrivalDone: 'Arrivée confirmée.',

      cancel403: 'Seul le téléphone qui a payé peut annuler cette commande.',

      unverified: 'Vendeur non vérifié', item: 'Article', delivery: 'Livraison', agencyFee: 'Frais d’agence',

      codeTitle: 'Votre code secret de libération', codeWarning: '⚠️ Donnez ce code au livreur seulement après avoir inspecté le colis.',

      payWith: 'Numéro MTN MoMo ou Orange Money', pay: (t) => `🔒 Payer ${t} en séquestre`,

      simulate: 'Mode test : simuler la validation', codInfo: '💵 Vous payez en cash au livreur après avoir inspecté le colis. Donnez-lui ensuite le code ci-dessus.',
      deliveryPoint: '📍 Point de livraison', useGps: '📍 Utiliser ma position actuelle', saveDelivery: 'Enregistrer l’adresse',
      addressPh: 'Quartier / adresse', landmarkPh: 'Repère : portail bleu face pharmacie…', saved: '✅ Enregistré',
      voiceTitle: '🎙️ Indications vocales (15 s max)', record: 'Enregistrer', stop: 'Arrêter', voiceSaved: '✅ Note vocale envoyée au livreur',
      riderTitle: 'Votre livreur', riderVerify: (c) => `Vérifiez-le à la porte : envoyez « /verify ${c} » au bot BayamSafe.`,
      call: (p) => `📞 Appeler ${p}`, trackTitle: 'Où est mon livreur', nearBanner: '📍 Votre livreur est tout près : préparez votre code et vérifiez le colis avant de le donner.',
      trackInfo: (d, m) => (d !== undefined ? `À ${d} km de vous · environ ${m} min` : 'En route vers vous'), trackAge: (m) => `position il y a ${m} min`,
      followBtn: '📲 Suivre ma commande sur Telegram', followHint: 'Recevez chaque étape et la position du livreur. Si c’est ce téléphone qui paie, votre code vous est aussi envoyé sur Telegram.',
      following: '✅ Suivi Telegram activé.', followNoBot: 'Le suivi Telegram n’est pas disponible pour le moment.',
      cancelOrder: '✖️ Annuler la commande', cancelConfirm: 'Annuler cette commande ? Si vous avez payé, vous êtes remboursé intégralement.', cancelled: 'Commande annulée.',
      timeline: 'Suivi', reportProblem: '⚠️ Signaler un problème avec le colis', disputePrompt: 'Décrivez le problème :',
      disputed: 'Litige ouvert. L’argent reste bloqué jusqu’à décision.', invalidLink: 'Lien invalide ou expiré. Demandez un nouveau lien au vendeur.',
      footer: 'BayamSafe · Séquestre pour le commerce en ligne au Cameroun', gpsFix: (a) => `Position fixée (±${a} m)`,
      gpsMoved: 'Marqueur déplacé', gpsFail: 'Position indisponible : déplacez le marqueur sur la carte.', micFail: 'Micro non accessible.',
      operator: { MTN: 'MTN Mobile Money', ORANGE: 'Orange Money' }, network: 'Erreur réseau, réessayez.',
      status: { PENDING_PAYMENT: 'En attente de paiement', AWAITING_RIDER: 'Payé · recherche de livreur', RIDER_ASSIGNED: 'Livreur en route vers le vendeur',
        IN_TRANSIT: 'Colis en route', AT_AGENCY: 'Déposé à l’agence', AT_DESTINATION_HUB: 'Arrivé dans votre ville', LAST_MILE_ASSIGNED: 'Livreur local assigné',
        OUT_FOR_DELIVERY: 'En cours de livraison', DELIVERED: 'Livré', SETTLED: 'Terminé', DISPUTED: 'Litige en cours', REFUNDED: 'Remboursé',
        CANCELLED: 'Annulé', EXPIRED: 'Lien expiré' }
    },
    en: {
      receivedBtn: 'I received my parcel', receivedConfirm: 'Confirm receipt? Payment will be released to the seller. This cannot be undone.', receivedDone: 'Thank you! The seller is being paid.',
      arrivalBtn: 'The agency called me, my parcel has arrived', arrivalHint: 'Tell us once the agency has called you; we alert the local rider.', arrivalDone: 'Arrival confirmed.',
      absenceTitle: 'The rider is at your door. You have 15 min, call them.', absenceLeft: (t) => `Time left: ${t}`, absenceOver: 'Time is up: the rider may leave with the parcel.', callRider: (p) => `📞 Call the rider${p ? ' (' + p + ')' : ''}`,
      recipient: (n) => `Hand over to: ${n}`, loadingMap: 'Loading map…', mapFail: 'The map is unavailable. You can still type the address.',
      evidenceTitle: 'Add photos to the dispute', evidenceHint: 'Up to 5 photos of the parcel (condition, contents). They go to support.', evidenceChoose: 'Choose photos',
      evidenceCount: (n) => `${n}/5 photos sent`, evidenceType: 'Photo rejected: unsupported format (JPEG, PNG or WebP).', evidenceLimit: 'Limit of 5 photos reached.', evidenceThumb: (i) => `Photo ${i} sent`,
      cancel403: 'Only the phone that paid can cancel this order.',
      tagline: 'Secure payment & delivery', loading: 'Loading…', verified: '🏅 Verified seller (ID checked)',
      unverified: 'Unverified seller', item: 'Item', delivery: 'Delivery', agencyFee: 'Agency fee',
      totalEscrow: 'Total to lock in escrow', totalCod: 'Total to pay the rider in cash',
      codeTitle: 'Your secret release code', codeWarning: '⚠️ Only give this code to the rider after inspecting the parcel.',
      otherDevice: 'The release code is only shown on the phone that made the payment.',
      payWith: 'MTN MoMo or Orange Money number', pay: (t) => `🔒 Pay ${t} into escrow`,
      escrowExplainer: 'Your money stays locked with BayamSafe. The seller is only paid when you give the rider the code after checking the parcel.',
      approveOnPhone: '📲 Approve the payment on your phone (enter your PIN).',
      ussd: (c) => `If nothing shows up, dial ${c} to see pending payments.`,
      simulate: 'Test mode: simulate approval', codInfo: '💵 You pay the rider in cash after inspecting the parcel, then give them the code above.',
      deliveryPoint: '📍 Delivery point', useGps: '📍 Use my current location', saveDelivery: 'Save address',
      addressPh: 'Neighbourhood / address', landmarkPh: 'Landmark: blue gate opposite pharmacy…', saved: '✅ Saved',
      voiceTitle: '🎙️ Voice directions (15 s max)', record: 'Record', stop: 'Stop', voiceSaved: '✅ Voice note sent to the rider',
      riderTitle: 'Your rider', riderVerify: (c) => `Check them at the door: send “/verify ${c}” to the BayamSafe bot.`,
      call: (p) => `📞 Call ${p}`, trackTitle: 'Where is my rider', nearBanner: '📍 Your rider is very close: get your code ready and check the parcel before giving it.',
      trackInfo: (d, m) => (d !== undefined ? `${d} km from you · about ${m} min` : 'On the way to you'), trackAge: (m) => `position ${m} min ago`,
      followBtn: '📲 Follow my order on Telegram', followHint: 'Get every step and the rider’s position. If this phone pays, your code is also sent to you on Telegram.',
      following: '✅ Telegram tracking is on.', followNoBot: 'Telegram tracking is not available right now.',
      cancelOrder: '✖️ Cancel order', cancelConfirm: 'Cancel this order? If you paid, you get a full refund.', cancelled: 'Order cancelled.',
      timeline: 'Tracking', reportProblem: '⚠️ Report a problem with the parcel', disputePrompt: 'Describe the problem:',
      disputed: 'Dispute opened. The money stays locked until a decision.', invalidLink: 'Invalid or expired link. Ask the seller for a new one.',

      gpsMoved: 'Marker moved', gpsFail: 'Location unavailable: drag the marker on the map.', micFail: 'Microphone not available.',
      operator: { MTN: 'MTN Mobile Money', ORANGE: 'Orange Money' }, network: 'Network error, please retry.',
      status: { PENDING_PAYMENT: 'Waiting for payment', AWAITING_RIDER: 'Paid · finding a rider', RIDER_ASSIGNED: 'Rider heading to seller',
        IN_TRANSIT: 'Parcel on the way', AT_AGENCY: 'Dropped at agency', AT_DESTINATION_HUB: 'Arrived in your city', LAST_MILE_ASSIGNED: 'Local rider assigned',
        OUT_FOR_DELIVERY: 'Out for delivery', DELIVERED: 'Delivered', SETTLED: 'Completed', DISPUTED: 'Under dispute', REFUNDED: 'Refunded',
        CANCELLED: 'Cancelled', EXPIRED: 'Link expired' }
    }

  const $ = (id) => document.getElementById(id);
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
  };
  let lang = store.get('bs_lang') || ((navigator.language || 'fr').startsWith('en') ? 'en' : 'fr');
  const T = () => I18N[lang];

  const params = new URLSearchParams(location.hash.slice(1));
  const orderId = params.get('o');
  const token = params.get('t');
  const sessionKey = `bs_session_${orderId}`;
  let view = null, health = null, pollTimer = null, map = null, marker = null, coords = null, botAvailable = false;

  const money = (n) => `${Number(n).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-US')} FCFA`;
  const show = (id, on) => $(id).classList.toggle('hidden', !on);
  const showError = (msg) => { $('error').textContent = msg; show('error', !!msg); };

  async function api(path, opts = {}) {
    const headers = Object.assign({ 'X-Buyer-Token': token || '' }, opts.headers || {});
    const session = store.get(sessionKey);
    if (session) headers['X-Buyer-Session'] = session;
    if (opts.json !== undefined) { headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(opts.json); }
    const res = await fetch(path, { method: opts.method || 'GET', headers, body: opts.body });
    const data = res.status === 204 ? {} : await res.json().catch(() => ({}));
    if (!res.ok) {
      // Show the server's message; fall back to a friendly text for known business-rule codes.
      const fb = {
        fr: { TOO_EARLY: 'Trop tôt : attendez un peu après le ramassage avant de confirmer la réception.', PAYER_IS_SELLER: 'Le numéro de paiement ne peut pas être celui du vendeur.', ALREADY_LINKED: 'Cette commande est déjà liée à un autre compte.', COD_CONFIRM_BY_RIDER: 'Pour un paiement à la livraison, c’est le livreur qui confirme la remise.' },
        en: { TOO_EARLY: 'Too early: please wait a little after pickup before confirming receipt.', PAYER_IS_SELLER: 'The payment number cannot be the seller’s.', ALREADY_LINKED: 'This order is already linked to another account.', COD_CONFIRM_BY_RIDER: 'For cash on delivery, the rider confirms the handover.' }
      };
      const msg = data.message || (fb[lang] && fb[lang][data.error]) || (res.status === 403 ? (lang === 'fr' ? 'Action réservée à l’appareil qui a payé.' : 'This action is reserved for the device that paid.') : T().network);
      throw Object.assign(new Error(msg), { status: res.status, code: data.error });
    }
    return data;
  }

  function applyI18n() {
    document.documentElement.lang = lang;
    document.querySelectorAll('[data-i18n]').forEach((el) => {
      const v = T()[el.dataset.i18n];
      if (typeof v === 'string') el.textContent = v;
    });
    $('langBtn').textContent = lang === 'fr' ? 'EN' : 'FR';
    $('addressInput').placeholder = T().addressPh;
    $('landmarkInput').placeholder = T().landmarkPh;
    if (view) render();
  }

  function detectOperator(raw) {
    let d = String(raw).replace(/\D/g, '');
    if (d.startsWith('237') && d.length === 12) d = d.slice(3);
    if (!/^6\d{8}$/.test(d)) return null;
    if (/^67|^65[0-4]|^68[0-4]/.test(d)) return 'MTN';
    if (/^69|^65[5-9]/.test(d)) return 'ORANGE';
    return '';
  }

  function render() {
    const v = view, t = T();
    $('merchantName').textContent = v.merchantName;
    show('verifiedBadge', v.merchantVerified);
    show('unverifiedBadge', !v.merchantVerified);
    $('trackingCode').textContent = v.trackingCode;
    $('itemTitle').textContent = v.itemTitle;
    $('statusBadge').textContent = t.status[v.status] || v.status;
    $('itemPrice').textContent = money(v.itemPrice);
    $('deliveryFee').textContent = money(v.deliveryFee);
    show('agencyRow', v.agencyFee > 0);
    $('agencyFee').textContent = money(v.agencyFee);
    show('routeRow', !!v.agency);
    if (v.agency) $('routeRow').textContent = `🚌 ${v.agency.name} ${v.agency.city} → ${v.destinationCity}${v.waybillNumber ? ' · ' + v.waybillNumber : ''}`;
    $('totalLabel').textContent = v.paymentMode === 'COD' ? t.totalCod : t.totalEscrow;
    $('total').textContent = money(v.total);

    show('codeSection', !!v.releaseCode);
    $('releaseCode').textContent = v.releaseCode || '';
    show('otherDevice', v.releaseCodeOnOtherDevice);

    show('paySection', v.can.pay && !v.payment.pending);
    show('pendingSection', v.can.pay && v.payment.pending);
    show('simulateBtn', health && health.payments === 'simulated');
    $('payBtn').textContent = t.pay(money(v.total));
    show('codInfo', v.paymentMode === 'COD' && !!v.releaseCode);

    show('deliverySection', v.can.editDelivery);
    if (document.activeElement !== $('addressInput')) $('addressInput').value = v.dropoffAddress || '';
    if (document.activeElement !== $('landmarkInput')) $('landmarkInput').value = v.landmark || '';
    if (v.hasVoiceNote && !$('voiceStatus').textContent) $('voiceStatus').textContent = t.voiceSaved;
    if (v.can.editDelivery) initMap(v.dropoffLocation);

    show('riderCard', !!v.rider);
    if (v.rider) {
      $('riderName').textContent = v.rider.firstName;
      $('riderMeta').textContent = `${v.rider.plateNumber} · ${v.rider.riderCode}`;
      $('riderVerify').textContent = t.riderVerify(v.rider.riderCode);
      if (v.rider.hasPhoto && $('riderPhoto').dataset.code !== v.rider.riderCode) {
        $('riderPhoto').dataset.code = v.rider.riderCode;
        fetch(`/api/checkout/${encodeURIComponent(orderId)}/rider-photo`, { headers: { 'X-Buyer-Token': token || '' } })
          .then((r) => (r.ok ? r.blob() : null))
          .then((b) => { if (b) { $('riderPhoto').src = URL.createObjectURL(b); $('riderPhoto').alt = v.rider.firstName; show('riderPhoto', true); } })
          .catch(() => {});
      }
    }

    show('riderCall', !!(v.rider && v.rider.phone));
    if (v.rider && v.rider.phone) { $('riderCall').textContent = t.call(v.rider.phone); $('riderCall').href = 'tel:' + v.rider.phone.replace(/\s/g, ''); }

    show('trackSection', !!v.tracking);
    if (v.tracking) drawTracking(v.tracking, v.dropoffLocation);
    show('nearBanner', !!(v.tracking && v.tracking.near));

    const active0 = !['SETTLED', 'REFUNDED', 'CANCELLED', 'EXPIRED', 'DELIVERED'].includes(v.status);
    show('followSection', active0 && !v.followingOnTelegram && !!(health && botAvailable));
    show('followingNote', !!v.followingOnTelegram && active0);
    show('cancelBtn', !!v.can.cancel);
    show('receivedBtn', !!v.can.confirmReceived);
    show('arrivalSection', !!v.can.confirmArrival);
    const rc = v.recipient;
    const rcText = rc && [rc.name, rc.phone].filter(Boolean).join(' · ');
    show('recipientRow', !!rcText);
    if (rcText) $('recipientRow').textContent = t.recipient(rcText);
    renderAbsence(v);
    renderEvidence(v);

    show('disputeBtn', !!v.can.dispute);
    const ol = $('timeline');
    ol.replaceChildren(...v.history.map((h) => {
      const li = document.createElement('li');
      li.textContent = `${new Date(h.at).toLocaleString(lang === 'fr' ? 'fr-FR' : 'en-GB', { dateStyle: 'short', timeStyle: 'short' })} · ${t.status[h.status] || h.status}`;
      return li;
    }).reverse());

    clearTimeout(pollTimer);
    const active = !['SETTLED', 'REFUNDED', 'CANCELLED', 'EXPIRED'].includes(v.status);
    if (active) pollTimer = setTimeout(load, v.payment.pending ? 4000 : v.tracking ? 10000 : 20000);
  }

  async function load() {
    try {
      view = await api(`/api/checkout/${encodeURIComponent(orderId)}`);
      show('loading', false); show('content', true); showError('');
      render();
    } catch (e) {
      show('loading', false);
      if (e.status === 404) { showError(T().invalidLink); show('content', false); }
      else { showError(e.message); pollTimer = setTimeout(load, 8000); }
    }
  }

  // Leaflet is only fetched when a map is actually shown (BS-302).
  let leafletP = null;
  function loadLeaflet() {
    if (typeof L !== 'undefined') return Promise.resolve();
    if (leafletP) return leafletP;
    leafletP = new Promise((resolve, reject) => {
      const css = document.createElement('link');
      css.rel = 'stylesheet'; css.href = '/vendor/leaflet/leaflet.css';
      document.head.append(css);
      const js = document.createElement('script');
      js.src = '/vendor/leaflet/leaflet.js';
      js.onload = () => { try { L.Icon.Default.imagePath = '/vendor/leaflet/images/'; } catch (e) {} resolve(); };
      js.onerror = () => { leafletP = null; reject(new Error('leaflet')); };
      document.head.append(js);
    });
    return leafletP;
  }
  function withMap(boxId, fn) {
    const box = $(boxId);
    if (!box.firstChild) box.textContent = T().loadingMap;
    loadLeaflet()
      .then(() => { if (box.firstChild && box.firstChild.nodeType === 3) box.textContent = ''; fn(); })
      .catch(() => { box.textContent = T().mapFail; });
  }

  let mapInit = false;
  function initMap(loc) {
    if (mapInit) return;
    mapInit = true;
    withMap('map', () => buildMap(loc));
  }
  function buildMap(loc) {
    if (map) return;
    const start = loc || { lat: 4.0511, lng: 9.7085 };
    map = L.map('map').setView([start.lat, start.lng], loc ? 16 : 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(map);
    marker = L.marker([start.lat, start.lng], { draggable: true }).addTo(map);
    if (loc) coords = loc;
    marker.on('dragend', () => { const p = marker.getLatLng(); coords = { lat: p.lat, lng: p.lng }; $('gpsStatus').textContent = T().gpsMoved; });
  }

  $('gpsBtn').onclick = () => {
    if (!map) return ($('gpsStatus').textContent = T().mapFail);
    if (!navigator.geolocation) return ($('gpsStatus').textContent = T().gpsFail);
    navigator.geolocation.getCurrentPosition((pos) => {
      coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      map.setView([coords.lat, coords.lng], 17); marker.setLatLng([coords.lat, coords.lng]);
      $('gpsStatus').textContent = T().gpsFix(Math.round(pos.coords.accuracy));
    }, () => { $('gpsStatus').textContent = T().gpsFail; }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  };

  $('saveDeliveryBtn').onclick = async () => {
    try {
      const body = { dropoffAddress: $('addressInput').value, landmark: $('landmarkInput').value };
      if (coords) body.dropoffLocation = coords;
      view = await api(`/api/checkout/${encodeURIComponent(orderId)}/delivery`, { method: 'PATCH', json: body });
      $('gpsStatus').textContent = T().saved; render();
    } catch (e) { showError(e.message); }
  };

  $('payerPhone').oninput = () => {
    const op = detectOperator($('payerPhone').value);
    $('operatorHint').textContent = op ? T().operator[op] : '';
  };

  $('payBtn').onclick = async () => {
    $('payBtn').disabled = true; showError('');
    try {
      const res = await api(`/api/checkout/${encodeURIComponent(orderId)}/pay`, { method: 'POST', json: { payerPhone: $('payerPhone').value } });
      store.set(sessionKey, res.sessionToken);
      $('ussdHint').textContent = res.ussdCode ? T().ussd(res.ussdCode) : '';
      await load();
    } catch (e) { showError(e.message); }
    finally { $('payBtn').disabled = false; }
  };

  $('simulateBtn').onclick = async () => {
    try { await api(`/api/dev/checkout/${encodeURIComponent(orderId)}/approve`, { method: 'POST' }); await load(); }
    catch (e) { showError(e.message); }
  };

  let trackQueued = false;
  let trackMap = null, riderMarker = null, homeMarker = null, trackLine = null;
  function drawTracking(tr, home) {
    const t = T();
    if (typeof L === 'undefined') {
      if (!trackQueued) { trackQueued = true; withMap('trackMap', () => { trackQueued = false; if (view && view.tracking) drawTracking(view.tracking, view.dropoffLocation); }); }
      return;
    }
    if (!trackMap) {
      trackMap = L.map('trackMap', { zoomControl: false });
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap', maxZoom: 19 }).addTo(trackMap);
    }
    const r = [tr.lat, tr.lng];
    if (!riderMarker) riderMarker = L.circleMarker(r, { radius: 10, color: '#0f172a', weight: 3, fillColor: '#f2b705', fillOpacity: 1 }).addTo(trackMap);
    else riderMarker.setLatLng(r);
    if (home) {
      const hm = [home.lat, home.lng];
      if (!homeMarker) homeMarker = L.circleMarker(hm, { radius: 8, color: '#ffffff', weight: 3, fillColor: '#059669', fillOpacity: 1 }).addTo(trackMap);
      if (trackLine) trackLine.setLatLngs([r, hm]); else trackLine = L.polyline([r, hm], { color: '#f2b705', weight: 3, dashArray: '5 7' }).addTo(trackMap);
      trackMap.fitBounds([r, hm], { padding: [30, 30], maxZoom: 16 });
    } else {
      trackMap.setView(r, 15);
    }
    $('trackInfo').textContent = t.trackInfo(tr.distanceKm, tr.etaMin);
    $('trackAge').textContent = t.trackAge(Math.max(0, Math.round((Date.now() - Date.parse(tr.at)) / 60000)));
  }

  $('followBtn').onclick = async () => {
    try {
      const res = await api(`/api/checkout/${encodeURIComponent(orderId)}/follow`, { method: 'POST' });
      store.set(sessionKey, res.sessionToken);
      window.location.href = res.url;
    } catch (e) { showError(e.status === 503 ? T().followNoBot : e.message); }
  };

  $('cancelBtn').onclick = async () => {
    if (!confirm(T().cancelConfirm)) return;
    try {
      view = await api(`/api/checkout/${encodeURIComponent(orderId)}/cancel`, { method: 'POST' });
      render();
      showError('');
    } catch (e) { fail(e.status === 403 ? (e.message && e.message !== T().network ? e.message : T().cancel403) : e.message); }
  };

  $('disputeBtn').onclick = async () => {
    const reason = prompt(T().disputePrompt);
    if (!reason) return;
    try { view = await api(`/api/checkout/${encodeURIComponent(orderId)}/dispute`, { method: 'POST', json: { reason } }); alert(T().disputed); render(); }
    catch (e) { showError(e.message); }
  };

  // Voice note (max 15 s)
  let recorder = null, chunks = [], seconds = 0, timer = null;
  $('recordBtn').onclick = async () => {
    if (recorder && recorder.state === 'recording') return recorder.stop();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const type = ['audio/webm;codecs=opus', 'audio/ogg;codecs=opus', 'audio/mp4'].find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || '';
      recorder = new MediaRecorder(stream, type ? { mimeType: type } : undefined);
      chunks = []; seconds = 0;
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = async () => {
        clearInterval(timer); stream.getTracks().forEach((tr) => tr.stop());
        $('recordBtn').textContent = T().record; $('recordBtn').classList.remove('pulse');
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        $('voicePlayback').src = URL.createObjectURL(blob); show('voicePlayback', true);
        try {
          await api(`/api/checkout/${encodeURIComponent(orderId)}/voice`, { method: 'PUT', body: blob, headers: { 'Content-Type': blob.type.split(';')[0] } });
          $('voiceStatus').textContent = T().voiceSaved;
        } catch (e) { $('voiceStatus').textContent = e.message; }
      };
      recorder.start();
      $('recordBtn').textContent = T().stop; $('recordBtn').classList.add('pulse');
      timer = setInterval(() => { seconds++; $('voiceTimer').textContent = `${seconds}s / 15s`; if (seconds >= 15) recorder.stop(); }, 1000);
    } catch { $('voiceStatus').textContent = T().micFail; }
  };

  const flash = (msg) => { $('statusMsg').textContent = msg; show('statusMsg', !!msg); if (msg) setTimeout(() => { if ($('statusMsg').textContent === msg) show('statusMsg', false); }, 8000); };
  const fail = (msg) => { showError(msg); $('error').scrollIntoView({ block: 'center' }); $('error').focus(); };

  // Buyer absence countdown: the rider waits 15 min from absence.at.
  let absTimer = null;
  const WAIT_MS = 15 * 60 * 1000;
  function renderAbsence(v) {
    clearInterval(absTimer);
    const on = !!(v.absence && v.absence.side === 'BUYER');
    show('absenceBanner', on);
    if (!on) return;
    const phone = v.rider && v.rider.phone;
    show('absenceCall', !!phone);
    if (phone) { $('absenceCall').textContent = T().callRider(phone); $('absenceCall').href = 'tel:' + phone.replace(/\s/g, ''); }
    const end = Date.parse(v.absence.at) + WAIT_MS;
    const tick = () => {
      const left = end - Date.now();
      if (left <= 0) { $('absenceTimer').textContent = T().absenceOver; clearInterval(absTimer); return; }
      const s = Math.ceil(left / 1000);
      $('absenceTimer').textContent = T().absenceLeft(`${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`);
    };
    tick(); absTimer = setInterval(tick, 1000);
  }

  $('receivedBtn').onclick = async () => {
    if (!confirm(T().receivedConfirm)) return;
    $('receivedBtn').disabled = true; showError('');
    try {
      view = await api(`/api/checkout/${encodeURIComponent(orderId)}/confirm-received`, { method: 'POST' });
      render(); flash(T().receivedDone);
    } catch (e) { fail(e.message); }
    finally { $('receivedBtn').disabled = false; }
  };
  $('arrivalBtn').onclick = async () => {
    $('arrivalBtn').disabled = true; showError('');
    try {
      view = await api(`/api/checkout/${encodeURIComponent(orderId)}/confirm-arrival`, { method: 'POST' });
      render(); flash(T().arrivalDone);
    } catch (e) { fail(e.message); }
    finally { $('arrivalBtn').disabled = false; }
  };

  // Dispute evidence: downscale to <=1600px JPEG (~0.8), upload one by one, max 5 in total.
  const MAX_PHOTOS = 5, OK_TYPES = ['image/jpeg', 'image/png', 'image/webp'];
  let evidenceSent = 0, evidenceBusy = false;
  const evErr = (m) => { $('evidenceErr').textContent = m || ''; show('evidenceErr', !!m); };
  function renderEvidence(v) {
    const on = v.status === 'DISPUTED' && !!v.can.addEvidence;
    show('evidenceSection', on);
    if (!on) return;
    evidenceSent = Math.max(evidenceSent, (v.dispute && Array.isArray(v.dispute.evidence)) ? v.dispute.evidence.length : 0);
    $('evidenceCount').textContent = T().evidenceCount(evidenceSent);
    $('evidenceBtn').disabled = evidenceBusy || evidenceSent >= MAX_PHOTOS;
  }
  function downscale(file) {
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => {
        const k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        c.toBlob((b) => { URL.revokeObjectURL(url); if (b) resolve({ blob: b, preview: URL.createObjectURL(b) }); else reject(new Error('encode')); }, 'image/jpeg', 0.8);
      };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('decode')); };
      im.src = url;
    });
  }
  $('evidenceBtn').onclick = () => $('evidenceInput').click();
  $('evidenceInput').onchange = async () => {
    const files = Array.from($('evidenceInput').files || []); $('evidenceInput').value = '';
    if (!files.length || evidenceBusy) return;
    evErr('');
    evidenceBusy = true; $('evidenceBtn').disabled = true;
    try {
      for (const f of files) {
        if (evidenceSent >= MAX_PHOTOS) { evErr(T().evidenceLimit); break; }
        if (!OK_TYPES.includes(f.type)) { evErr(T().evidenceType); continue; }
        try {
          const { blob, preview } = await downscale(f);
          await api(`/api/checkout/${encodeURIComponent(orderId)}/evidence`, { method: 'POST', body: blob, headers: { 'Content-Type': 'image/jpeg' } });
          evidenceSent++;
          const li = document.createElement('li'); const im = document.createElement('img');
          im.src = preview; im.alt = T().evidenceThumb(evidenceSent); im.className = 'w-full aspect-square object-cover rounded-lg border border-red-200';
          li.append(im); $('evidenceThumbs').append(li);
          $('evidenceCount').textContent = T().evidenceCount(evidenceSent);
        } catch (e) { evErr(e.message === 'decode' || e.message === 'encode' ? T().evidenceType : e.message); }
      }
    } finally { evidenceBusy = false; $('evidenceBtn').disabled = evidenceSent >= MAX_PHOTOS; }
  };

  $('langBtn').onclick = () => { lang = lang === 'fr' ? 'en' : 'fr'; store.set('bs_lang', lang); applyI18n(); };

  applyI18n();
  if (!orderId || !token) { show('loading', false); showError(T().invalidLink); return; }
  fetch('/api/health').then((r) => r.json()).then((h) => { health = h; if (view) render(); }).catch(() => {});
  fetch('/api/config').then((r) => r.json()).then((c) => { botAvailable = !!c.botUsername; if (view) render(); }).catch(() => {});
  load();
})();
</script>
</body>
</html>
